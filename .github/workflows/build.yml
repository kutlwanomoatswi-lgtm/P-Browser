name: Build PS5 PSBrowser

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang lld libsdl2-dev libsdl2-image-dev libcurl4-openssl-dev python3 zip git

      - name: Setup Open-Source PS5 Payload SDK
        run: |
          git clone --recursive https://github.com/ps5-payload-dev/sdk.git ps5_sdk
          echo "PS5_SDK_PATH=$(pwd)/ps5_sdk" >> $GITHUB_ENV

      - name: Clone Dear ImGui
        run: |
          git clone --depth 1 --branch v1.91.5 https://github.com/ocornut/imgui.git third_party/imgui

      - name: Clean & Compile Binary
        run: |
          rm -rf build
          mkdir build && cd build
          cmake .. -DPS5_SDK_PATH=${{ env.PS5_SDK_PATH }}
          make -j4

      - name: Prepare ShadowMountPlus Staging Directory
        run: |
          mkdir -p output/PPSA99080/sce_sys
          cp build/eboot.bin output/PPSA99080/eboot.bin

          if [ -f "PPSA99080/sce_sys/param.json" ]; then
            cp PPSA99080/sce_sys/param.json output/PPSA99080/sce_sys/param.json
          fi

          if [ -f "icon0.png" ]; then
            cp icon0.png output/PPSA99080/sce_sys/icon0.png
          fi

          cd output
          zip -r ../PPSA99080-ShadowMount-13.60.zip PPSA99080/
          cd ..

      - name: Upload ShadowMount Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSBrowser-PS5-13.60-ShadowMount
          path: PPSA99080-ShadowMount-13.60.zip
