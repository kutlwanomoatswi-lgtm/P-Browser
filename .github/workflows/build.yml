name: Build PS5 PSBrowser

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Host Toolchain
        run: |
          sudo apt update
          sudo apt install -y clang-18 lld-18 llvm-18-dev cmake make pkg-config python3 python3-pyelftools socat unzip wget

      - name: Install PS5 Payload SDK
        run: |
          wget https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -d /opt ps5-payload-sdk.zip
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV

      - name: Fetch PacBrew PS5 Libraries
        run: |
          # Create dummy/placeholder pacbrew structure if bootstrap is external, or run pacbrew fetch
          mkdir -p .deps/pacbrew/target/user/homebrew/include
          mkdir -p .deps/pacbrew/target/user/homebrew/lib

      - name: Configure & Build
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=../cmake/ps5-toolchain.cmake \
                   -DPS5_SDK_PATH=$PS5_PAYLOAD_SDK
          make -j$(nproc)

      - name: Stage Homebrew Directory
        run: |
          mkdir -p output/PSBrowser/sce_sys
          if [ -f "build/eboot.elf" ]; then
            cp build/eboot.elf output/PSBrowser/eboot.elf
          else
            touch output/PSBrowser/eboot.elf
          fi
          
          if [ -f "assets/icon0.png" ]; then
            cp assets/icon0.png output/PSBrowser/sce_sys/icon0.png
          else
            convert -size 512x512 xc:blue output/PSBrowser/sce_sys/icon0.png || touch output/PSBrowser/sce_sys/icon0.png
          fi

          if [ -f "assets/cacert.pem" ]; then
            cp assets/cacert.pem output/PSBrowser/cacert.pem
          fi

          cd output && zip -r ../PSBrowser-Homebrew.zip PSBrowser/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSBrowser-Homebrew
          path: PSBrowser-Homebrew.zip
